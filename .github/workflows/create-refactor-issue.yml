name: Create issue from refactor doc
permissions:
  issues: write
on:
  workflow_dispatch:
    inputs:
      file:
        description: Path to the markdown file to file as an issue
        required: true
        default: support-frontend/assets/pages/supporter-plus-landing/twoStepPages/threeTierLanding.REFACTOR.md
      title:
        description: Issue title
        required: true
        default: "ThreeTierLanding refactor proposal"
jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ github.event.inputs.file }}', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '${{ github.event.inputs.title }}',
              body,
            });
