name: Create Asana tasks for ThreeTierLanding refactor
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      project_gid:
        description: Asana project GID to create tasks in
        required: true
        default: "1213112839739792"
jobs:
  create-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          PROJECT_GID: ${{ github.event.inputs.project_gid }}
        with:
          script: |
            const { ASANA_PAT, PROJECT_GID } = process.env;
            const docPath =
              'support-frontend/assets/pages/supporter-plus-landing/twoStepPages/threeTierLanding.REFACTOR.md';

            const steps = [
              {
                name: '[ThreeTierLanding refactor] 1. Remove/fix unused abParticipations prop',
                notes: `Remove abParticipations from ThreeTierLandingProps (or wire it up) since it is currently declared but never used.\n\nSee: ${docPath}`,
              },
              {
                name: '[ThreeTierLanding refactor] 2. Extract useThreeTierUrlSelection hook',
                notes: `Replace direct window.location.search reads in the component body with a useThreeTierUrlSelection hook to unlock isolated unit tests.\n\nSee: ${docPath}`,
              },
              {
                name: '[ThreeTierLanding refactor] 3. Simplify useRatePlanKey',
                notes: `Drop the useState/useEffect mirroring in useRatePlanKey and compute ratePlanKey directly with useMemo.\n\nSee: ${docPath}`,
              },
              {
                name: '[ThreeTierLanding refactor] 4. Introduce useTierCardContent',
                notes: `Unify tier1Card/tier2Card/tier3Card builders into a single data-driven useTierCardContent hook. Migrate tier 2 and 3 first, then tier 1 once the "no promotion" case is confirmed intentional.\n\nSee: ${docPath}`,
              },
              {
                name: '[ThreeTierLanding refactor] 5. Extract ThreeTierFooter and move getPlanCost',
                notes: `Extract the footer JSX into a ThreeTierFooter component and move the deprecated getPlanCost into its own module.\n\nSee: ${docPath}`,
              },
              {
                name: '[ThreeTierLanding refactor] 6. Name remaining magic literals',
                notes: `Extract STUDENT_OFFER_REGIONS, DIVIDER_BORDER_COLOR, and other inline literals into named constants.\n\nSee: ${docPath}`,
              },
            ];

            for (const step of steps) {
              const response = await fetch('https://app.asana.com/api/1.0/tasks', {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${ASANA_PAT}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  data: {
                    name: step.name,
                    notes: step.notes,
                    projects: [PROJECT_GID],
                  },
                }),
              });
              if (!response.ok) {
                const body = await response.text();
                throw new Error(`Asana API error (${response.status}): ${body}`);
              }
              const json = await response.json();
              console.log(`Created task ${json.data.gid}: ${step.name}`);
            }
